name: TrainBoardV1
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.6
options:
  bundleIdPrefix: com.josephmoylan
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    CODE_SIGN_IDENTITY: "Developer ID Application"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: 69TCYK37VK
    # macOS 15 widget gallery ignores the extension if base entitlements (get-task-allow) are injected
    CODE_SIGN_INJECT_BASE_ENTITLEMENTS: "NO"
    ENABLE_HARDENED_RUNTIME: "YES"
    OTHER_CODE_SIGN_FLAGS: "--timestamp"  # notarization needs secure timestamps
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  TrainBoardV1:
    type: application
    platform: macOS
    sources: [App, Shared]
    entitlements:
      path: App/App.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups: [69TCYK37VK.com.josephmoylan.trainboardv1]
        # lets the sandboxed app hand updates to Sparkle's installer
        com.apple.security.temporary-exception.mach-lookup.global-name:
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spks
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spki
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: TrainBoard V1
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Sparkle: check the appcast daily and install updates without asking
        SUFeedURL: https://raw.githubusercontent.com/Joseph2475/trainboard-v1/main/appcast.xml
        SUPublicEDKey: HcbTYts2LdrZu7HlQdbWtWpHgYTomChnLnMBgHzbS0Q=
        SUEnableInstallerLauncherService: true
        SUEnableAutomaticChecks: true
        SUAutomaticallyUpdate: true
    settings:
      base:
        PRODUCT_NAME: TrainBoard V1
        PRODUCT_BUNDLE_IDENTIFIER: com.josephmoylan.trainboardv1
    dependencies:
      - target: TrainBoardV1Widget
        embed: true
      - package: Sparkle
    scheme:
      testTargets: [TrainBoardV1Tests]
  TrainBoardV1Widget:
    type: app-extension
    platform: macOS
    sources: [Widget, Shared]
    entitlements:
      path: Widget/Widget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups: [69TCYK37VK.com.josephmoylan.trainboardv1]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: TrainBoard V1
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # classic appex in PlugIns is the only form the macOS widget gallery picks up
        CFBundlePackageType: XPC!
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.josephmoylan.trainboardv1.widget
  TrainBoardV1Tests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests, Shared]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: "NO"
        OTHER_CODE_SIGN_FLAGS: ""
